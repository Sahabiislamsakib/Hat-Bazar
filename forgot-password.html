<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Hat Bazar | Reset Your Password</title>
    <meta name="description" content="Reset your Hat Bazar account password. We'll send you a link to create a new password.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-bar-content">
                <div class="top-bar-left">
                    <span><i data-lucide="truck" style="width:14px;height:14px;vertical-align:middle;"></i> Free shipping on orders over ৳2000</span>
                    <span><i data-lucide="phone" style="width:14px;height:14px;vertical-align:middle;"></i> 09678-123456</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><i data-lucide="shopping-bag"></i></span>
                    Hat Bazar
                </a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Forgot Password? <i data-lucide="key-round" style="width:22px;height:22px;vertical-align:middle;color:var(--primary);"></i></h2>
                <p>Enter your email and we'll send you a link to reset your password</p>
            </div>

            <!-- Forgot Password Form -->
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label class="form-label form-label-required">Email Address</label>
                    <div class="form-input-icon-wrapper">
                        <span class="form-input-icon"><i data-lucide="mail" style="width:16px;height:16px;vertical-align:middle;"></i></span>
                        <input type="email" class="form-input" id="forgot-email" placeholder="Enter your email" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Sign In</a></p>
                <p style="margin-top: 8px;">Don't have an account? <a href="register.html">Create Account</a></p>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-muted" style="font-size: 0.9rem;"><i data-lucide="arrow-left" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="padding-top: 40px;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Hat Bazar. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script>
        function handleForgotPassword(e) {
            e.preventDefault();
            
            const email = document.getElementById('forgot-email').value;
            
            // Demo: Simulate password reset
            showToast('Password reset link sent to ' + email, 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    </script>
</body>
</html>
