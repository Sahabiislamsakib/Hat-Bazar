<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hat Bazar | Sign In to Your Account</title>
    <meta name="description" content="Sign in to your Hat Bazar account. Access your orders, wishlist, and manage your profile.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-bar-content">
                <div class="top-bar-left">
                    <span><i data-lucide="truck" style="width:14px;height:14px;vertical-align:middle;"></i> Free shipping on orders over ৳2000</span>
                    <span><i data-lucide="phone" style="width:14px;height:14px;vertical-align:middle;"></i> 09678-123456</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><i data-lucide="shopping-bag"></i></span>
                    Hat Bazar
                </a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back!</h2>
                <p>Sign in to access your account</p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn" onclick="showToast('Google login coming soon!', 'info')">
                    <i data-lucide="search" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i> Google
                </button>
                <button class="social-btn" onclick="showToast('Facebook login coming soon!', 'info')">
                    <i data-lucide="facebook" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i> Facebook
                </button>
            </div>

            <div class="divider">
                <span>Or sign in with email</span>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label form-label-required">Email Address</label>
                    <div class="form-input-icon-wrapper">
                        <span class="form-input-icon"><i data-lucide="mail" style="width:16px;height:16px;vertical-align:middle;"></i></span>
                        <input type="email" class="form-input" id="login-email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label form-label-required">Password</label>
                    <div class="form-input-icon-wrapper">
                        <span class="form-input-icon"><i data-lucide="lock" style="width:16px;height:16px;vertical-align:middle;"></i></span>
                        <input type="password" class="form-input" id="login-password" placeholder="Enter your password" minlength="6" required>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <label class="form-check">
                        <input type="checkbox" class="form-check-input">
                        <span class="form-check-label">Remember me</span>
                    </label>
                    <a href="forgot-password.html" style="font-size: 0.9rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-muted" style="font-size: 0.9rem;"><i data-lucide="arrow-left" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="padding-top: 40px;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Hat Bazar. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            // Demo: Simulate login
            localStorage.setItem('user', JSON.stringify({ email, name: 'Demo User' }));
            showToast('Welcome back! Login successful.', 'success');
            
            setTimeout(() => {
                window.location.href = 'account.html';
            }, 1500);
        }
    </script>
</body>
</html>
